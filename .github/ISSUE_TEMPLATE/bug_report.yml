name: "System Profiler bug"
description: Something in the System Profiler app does not work as expected.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead. Name the page (e.g. Battery Care).
    validations:
      required: true
  - type: input
    id: laptop
    attributes:
      label: Laptop model
      placeholder: "ASUS TUF Gaming A15 FA506ICB"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Distribution, kernel and session
      placeholder: "Ubuntu 24.04, 6.8.0-147-generic, XFCE on X11"
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Shown on Settings > About.
      placeholder: "System Profiler 6.5.0, asusd 6.5.0"
  - type: textarea
    id: log
    attributes:
      label: Log
      description: "Output of `RUST_LOG=debug system-profiler` run from a terminal while reproducing the problem."
      render: text
